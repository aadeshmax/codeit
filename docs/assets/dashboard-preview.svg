      <text x="32" y="90" fill="#515154" font-size="11.5" class="mono">87</text>
      <text x="56" y="90" fill="#F5F5F7" font-size="11.5" class="mono">resp = requests.get(upstream_url, timeout=10)  # freezes event loop</text>
