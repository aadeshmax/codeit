    <text x="157" y="31" text-anchor="middle" fill="#86868B" font-size="11" class="mono">L42</text>

    <rect x="462" y="16" width="72" height="22" rx="11" fill="#1C1C1E" stroke="rgba(255,255,255,0.08)"/>
    <text x="498" y="31" text-anchor="middle" fill="#F5F5F7" font-size="11" class="ui">Security</text>
    <rect x="542" y="16" width="70" height="22" rx="11" fill="rgba(255,69,58,0.14)" stroke="rgba(255,69,58,0.35)"/>
    <text x="577" y="31" text-anchor="middle" fill="#FF453A" font-size="11" font-weight="600" class="ui">Critical</text>

    <text x="24" y="62" fill="#F5F5F7" font-size="15.5" font-weight="600" class="ui">CWE-89: Unparameterized SQL Query String Interpolation</text>

    <!-- Code Snippet -->
    <rect x="24" y="76" width="588" height="44" rx="10" fill="#1C1C1E" stroke="rgba(255,255,255,0.08)"/>
    <text x="38" y="102" fill="#515154" font-size="12" class="mono">42</text>
    <text x="66" y="102" fill="#F5F5F7" font-size="12" class="mono">cursor.execute(f"SELECT * FROM users WHERE email = '{user_email}'")</text>

    <!-- Socratic Question -->
    <rect x="24" y="132" width="588" height="58" rx="10" fill="#1C1C1E" stroke="rgba(10,132,255,0.32)"/>
    <text x="38" y="150" fill="#0A84FF" font-size="10" font-weight="600" letter-spacing="0.8" class="ui">SOCRATIC GUIDING QUESTION</text>
    <text x="38" y="172" fill="#F5F5F7" font-size="12.5" class="ui">Since user_email goes straight into the SQL string, what parameterized method treats it strictly as data?</text>

    <!-- Interactive Checklist -->
    <text x="24" y="214" fill="#86868B" font-size="10.5" font-weight="600" letter-spacing="0.8" class="ui">INVESTIGATION CHECKLIST (PERSISTED IN LOCALSTORAGE)</text>
    <text x="612" y="214" text-anchor="end" fill="#30D158" font-size="11" font-weight="600" class="mono">1/2</text>

    <rect x="24" y="224" width="588" height="34" rx="8" fill="#1C1C1E" stroke="rgba(48,209,88,0.35)"/>
    <rect x="36" y="233" width="16" height="16" rx="4" fill="#30D158"/>
    <text x="44" y="245" text-anchor="middle" fill="#000000" font-size="11" font-weight="700" class="ui">✓</text>
    <text x="62" y="245" fill="#86868B" font-size="12" text-decoration="line-through" class="ui">Open auth/login.py around line 42 and trace where user_email originates.</text>

    <rect x="24" y="264" width="588" height="34" rx="8" fill="#1C1C1E" stroke="rgba(255,255,255,0.08)"/>
