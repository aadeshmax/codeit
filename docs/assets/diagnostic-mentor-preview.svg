    <rect x="24" y="310" width="588" height="44" rx="10" fill="#1C1C1E" stroke="rgba(255,214,10,0.25)"/>
    <text x="38" y="327" fill="#FFD60A" font-size="10" font-weight="600" letter-spacing="0.8" class="ui">VERIFICATION CHALLENGE</text>
    <text x="38" y="344" fill="#F5F5F7" font-size="11.5" class="ui">Test with input `' OR '1'='1` and verify the query returns zero rows instead of bypassing login.</text>

    <text x="612" y="378" text-anchor="end" fill="#0A84FF" font-size="12" font-weight="600" class="ui">Ask Mentor about this →</text>
