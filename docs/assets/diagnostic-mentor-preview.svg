  <!-- Right: Socratic Mentor Slide-Over Drawer (POST /api/student/stuck) -->
  <g transform="translate(676, 24)">
    <rect width="500" height="392" rx="20" fill="#18181B" stroke="rgba(10,132,255,0.4)"/>
