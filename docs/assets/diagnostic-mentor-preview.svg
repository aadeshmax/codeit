    <text x="420" y="30" text-anchor="middle" fill="#0A84FF" font-size="10.5" font-weight="600" class="mono">gpt-oss-20b</text>
    <line x1="24" y1="48" x2="476" y2="48" stroke="rgba(255,255,255,0.08)"/>

    <!-- Student Question Bubble -->
    <rect x="84" y="62" width="392" height="46" rx="12" fill="#0A84FF"/>
    <text x="98" y="82" fill="#FFFFFF" font-size="11.5" font-weight="500" class="ui">I tried cursor.execute("SELECT * FROM users WHERE email = ?",</text>
    <text x="98" y="98" fill="#FFFFFF" font-size="11.5" font-weight="500" class="ui">user_email) but Python threw a TypeError: parameters are of unsupported type.</text>

    <!-- Mentor Diagnosis Response -->
    <rect x="24" y="122" width="452" height="206" rx="14" fill="#141416" stroke="rgba(255,255,255,0.08)"/>
    <text x="38" y="144" fill="#86868B" font-size="10" font-weight="600" letter-spacing="0.8" class="ui">TECHNICAL DIAGNOSIS</text>
    <text x="38" y="163" fill="#F5F5F7" font-size="11.5" class="ui">The DB-API 2.0 execute() method expects a sequence (like a tuple or list)</text>
    <text x="38" y="180" fill="#F5F5F7" font-size="11.5" class="ui">as its second argument. Passing a bare string makes the driver iterate over</text>
    <text x="38" y="197" fill="#F5F5F7" font-size="11.5" class="ui">each individual character in user_email instead of binding a single value.</text>

    <rect x="38" y="212" width="424" height="52" rx="9" fill="#1C1C1E" stroke="rgba(10,132,255,0.28)"/>
    <text x="50" y="229" fill="#0A84FF" font-size="9.5" font-weight="600" letter-spacing="0.7" class="ui">FOLLOW-UP SOCRATIC NUDGE</text>
    <text x="50" y="248" fill="#F5F5F7" font-size="11.5" class="ui">How do you write a single-element tuple in Python so user_email is passed as 1 item?</text>

    <text x="38" y="286" fill="#30D158" font-size="10.5" font-weight="600" class="mono">→ Checkpoint Thread Resumed (Zero Re-Scan · LangGraph State)</text>
    <text x="38" y="308" fill="#86868B" font-size="11" class="ui">Step: Wrap the second argument in a 1-tuple with a trailing comma.</text>

    <!-- Follow-up Input Box -->
    <rect x="24" y="342" width="372" height="34" rx="9" fill="#141416" stroke="rgba(255,255,255,0.12)"/>
    <text x="38" y="363" fill="#86868B" font-size="11.5" class="ui">Ask a follow-up question on this thread...</text>
    <rect x="404" y="342" width="72" height="34" rx="9" fill="#0A84FF"/>
    <text x="440" y="363" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="600" class="ui">Send</text>
