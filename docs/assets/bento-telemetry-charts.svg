<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
      .mono { font-family: "SF Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    </style>
  </defs>
  <rect width="1200" height="320" rx="16" fill="#000000" stroke="rgba(255,255,255,0.12)"/>

  <!-- 1. Radial Gauge -->
  <g transform="translate(24, 24)">
    <rect width="276" height="272" rx="20" fill="#141416" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="30" fill="#F5F5F7" font-size="13.5" font-weight="600" class="ui">1. Overall Health Gauge</text>
    <circle cx="138" cy="130" r="56" fill="none" stroke="#1C1C1E" stroke-width="10"/>
    <circle cx="138" cy="130" r="56" fill="none" stroke="#30D158" stroke-width="10" stroke-linecap="round" stroke-dasharray="351.8" stroke-dashoffset="77.4" transform="rotate(-90 138 130)"/>
    <text x="138" y="138" text-anchor="middle" fill="#F5F5F7" font-size="34" font-weight="700" class="mono">78</text>
    <text x="138" y="156" text-anchor="middle" fill="#86868B" font-size="11" class="mono">OVERALL SCORE</text>
    <line x1="20" y1="214" x2="256" y2="214" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="242" fill="#86868B" font-size="11" class="mono">≥75 #30D158 · 50–74 #FFD60A · &lt;50 #FF453A</text>
  </g>

  <!-- 2. Multi-Axis Radar -->
  <g transform="translate(316, 24)">
    <rect width="276" height="272" rx="20" fill="#141416" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="30" fill="#F5F5F7" font-size="13.5" font-weight="600" class="ui">2. 4-Axis Radar Polygon</text>
    <polygon points="138,72 202,136 138,200 74,136" fill="none" stroke="rgba(255,255,255,0.08)"/>
    <polygon points="138,93 181,136 138,179 95,136" fill="none" stroke="rgba(255,255,255,0.08)"/>
    <polygon points="138,114 160,136 138,158 116,136" fill="none" stroke="rgba(255,255,255,0.08)"/>
    <line x1="138" y1="72" x2="138" y2="200" stroke="rgba(255,255,255,0.08)"/>
    <line x1="74" y1="136" x2="202" y2="136" stroke="rgba(255,255,255,0.08)"/>
    <polygon points="138,90 192,136 138,185 82,136" fill="rgba(10,132,255,0.2)" stroke="#0A84FF" stroke-width="2"/>
    <circle cx="138" cy="90" r="4" fill="#0A84FF"/><circle cx="192" cy="136" r="4" fill="#0A84FF"/>
    <circle cx="138" cy="185" r="4" fill="#0A84FF"/><circle cx="82" cy="136" r="4" fill="#0A84FF"/>
    <text x="138" y="62" text-anchor="middle" fill="#F5F5F7" font-size="11" class="mono">Security (72)</text>
    <text x="208" y="140" fill="#F5F5F7" font-size="11" class="mono">Arch (84)</text>
    <text x="138" y="218" text-anchor="middle" fill="#F5F5F7" font-size="11" class="mono">Efficiency (76)</text>
    <text x="68" y="140" text-anchor="end" fill="#F5F5F7" font-size="11" class="mono">Syntax (88)</text>
    <text x="20" y="246" fill="#86868B" font-size="11" class="ui">Click any axis node to filter diagnostic cards</text>
  </g>

  <!-- 3. Severity Donut -->
  <g transform="translate(608, 24)">
    <rect width="276" height="272" rx="20" fill="#141416" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="30" fill="#F5F5F7" font-size="13.5" font-weight="600" class="ui">3. Severity Donut Ring</text>
    <circle cx="96" cy="138" r="48" fill="none" stroke="#1C1C1E" stroke-width="14"/>
    <circle cx="96" cy="138" r="48" fill="none" stroke="#FF453A" stroke-width="14" stroke-dasharray="42 260" stroke-dashoffset="0" transform="rotate(-90 96 138)"/>
    <circle cx="96" cy="138" r="48" fill="none" stroke="#FF9F0A" stroke-width="14" stroke-dasharray="84 218" stroke-dashoffset="-44" transform="rotate(-90 96 138)"/>
    <circle cx="96" cy="138" r="48" fill="none" stroke="#FFD60A" stroke-width="14" stroke-dasharray="126 176" stroke-dashoffset="-130" transform="rotate(-90 96 138)"/>
    <circle cx="96" cy="138" r="48" fill="none" stroke="#30D158" stroke-width="14" stroke-dasharray="40 262" stroke-dashoffset="-258" transform="rotate(-90 96 138)"/>
    <text x="96" y="144" text-anchor="middle" fill="#F5F5F7" font-size="24" font-weight="700" class="mono">7</text>
    <g transform="translate(166, 86)">
      <circle cx="6" cy="8" r="4" fill="#FF453A"/><text x="16" y="12" fill="#F5F5F7" font-size="11.5" class="ui">Critical</text><text x="86" y="12" text-anchor="end" fill="#86868B" font-size="11.5" class="mono">1</text>
      <circle cx="6" cy="36" r="4" fill="#FF9F0A"/><text x="16" y="40" fill="#F5F5F7" font-size="11.5" class="ui">High</text><text x="86" y="40" text-anchor="end" fill="#86868B" font-size="11.5" class="mono">2</text>
      <circle cx="6" cy="64" r="4" fill="#FFD60A"/><text x="16" y="68" fill="#F5F5F7" font-size="11.5" class="ui">Medium</text><text x="86" y="68" text-anchor="end" fill="#86868B" font-size="11.5" class="mono">3</text>
      <circle cx="6" cy="92" r="4" fill="#30D158"/><text x="16" y="96" fill="#F5F5F7" font-size="11.5" class="ui">Low</text><text x="86" y="96" text-anchor="end" fill="#86868B" font-size="11.5" class="mono">1</text>
    </g>
    <text x="20" y="246" fill="#86868B" font-size="11" class="ui">Interactive arc segments filter by severity</text>
  </g>

  <!-- 4. File Hotspots -->
  <g transform="translate(900, 24)">
    <rect width="276" height="272" rx="20" fill="#141416" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="30" fill="#F5F5F7" font-size="13.5" font-weight="600" class="ui">4. File Hotspots Bars</text>
    <g transform="translate(20, 62)">
      <text x="0" y="12" fill="#F5F5F7" font-size="11.5" class="mono">auth/login.py</text><text x="236" y="12" text-anchor="end" fill="#FF453A" font-size="11.5" font-weight="600" class="mono">3 issues</text>
      <rect x="0" y="20" width="236" height="7" rx="3.5" fill="#1C1C1E"/><rect x="0" y="20" width="204" height="7" rx="3.5" fill="#FF453A"/>
    </g>
    <g transform="translate(20, 108)">
      <text x="0" y="12" fill="#F5F5F7" font-size="11.5" class="mono">api/routes.py</text><text x="236" y="12" text-anchor="end" fill="#FF9F0A" font-size="11.5" font-weight="600" class="mono">2 issues</text>
      <rect x="0" y="20" width="236" height="7" rx="3.5" fill="#1C1C1E"/><rect x="0" y="20" width="138" height="7" rx="3.5" fill="#FF9F0A"/>
    </g>
    <g transform="translate(20, 154)">
      <text x="0" y="12" fill="#F5F5F7" font-size="11.5" class="mono">db/session.py</text><text x="236" y="12" text-anchor="end" fill="#FFD60A" font-size="11.5" font-weight="600" class="mono">1 issue</text>
      <rect x="0" y="20" width="236" height="7" rx="3.5" fill="#1C1C1E"/><rect x="0" y="20" width="72" height="7" rx="3.5" fill="#FFD60A"/>
    </g>
    <g transform="translate(20, 200)">
      <text x="0" y="12" fill="#F5F5F7" font-size="11.5" class="mono">utils/parser.py</text><text x="236" y="12" text-anchor="end" fill="#FFD60A" font-size="11.5" font-weight="600" class="mono">1 issue</text>
      <rect x="0" y="20" width="236" height="7" rx="3.5" fill="#1C1C1E"/><rect x="0" y="20" width="72" height="7" rx="3.5" fill="#FFD60A"/>
    </g>
    <text x="20" y="246" fill="#86868B" font-size="11" class="ui">Click a file row to isolate findings per module</text>
  </g>
</svg>
